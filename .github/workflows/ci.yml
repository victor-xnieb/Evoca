name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --settings=config.settings_test

  frontend:
    name: Frontend (lint, tipos, pruebas, build y Storybook)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook

  migrate-development:
    name: Migrar Neon development
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    concurrency:
      group: neon-development-migrations
      cancel-in-progress: false
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.NEON_DEVELOPMENT_DATABASE_URL_UNPOOLED }}
      USE_UNPOOLED_DATABASE: "True"
      DJANGO_SECRET_KEY: github-actions-migration-only
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Verificar secreto de Neon
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Falta el secreto NEON_DEVELOPMENT_DATABASE_URL_UNPOOLED"
            exit 1
          fi
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Aplicar migraciones pendientes
        run: python manage.py migrate --noinput

